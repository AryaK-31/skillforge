server:
  port: ${AUTH_SERVICE_PORT:8081}
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: auth-service

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/skillforge_auth}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: auth-service-hikari-pool
      maximum-pool-size: ${AUTH_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${AUTH_DB_MIN_IDLE:2}
      connection-timeout: ${AUTH_DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${AUTH_DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${AUTH_DB_MAX_LIFETIME:1800000}

  jpa:
    open-in-view: false
    show-sql: ${AUTH_JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${AUTH_JPA_FORMAT_SQL:true}
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${AUTH_REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.skillforge.authservice: ${LOG_LEVEL_AUTH_SERVICE:INFO}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:skillforge-auth-service}
      secret: ${JWT_SECRET:4b4d4b63794d6b6f6b6b734c6f6e675365637265744b6579466f72536b696c6c466f72676532303236}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}
    password:
      strength: ${PASSWORD_ENCODER_STRENGTH:12}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin
      exposed-headers: Authorization
      allow-credentials: true
      max-age: 3600

info:
  app:
    name: ${spring.application.name}
    description: Authentication and authorization service for SkillForge
    version: ${project.version:1.0.0}
